name: Publish to npm

on:
    # Auto-publish when a merge to main changes the version in package.json.
    # npm-publish is idempotent: if the version is already on npm it skips, so a
    # package.json change that doesn't bump the version is a no-op.
    push:
        branches: [main]
        paths:
            - package.json
    release:
        types: [published]
    workflow_dispatch:
        inputs:
            version:
                description: 'Version to publish (e.g., 1.0.0)'
                required: true
                type: string

jobs:
    publish:
        name: Publish Package
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write # required for OIDC trusted publishing (no token)

        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '22.x'
                  registry-url: 'https://registry.npmjs.org'
                  cache: 'npm'

            # Trusted publishing (OIDC) requires npm >= 11.5.1.
            - name: Upgrade npm
              run: npm install -g npm@latest

            - name: Install dependencies
              run: npm ci

            - name: Run tests
              run: npm test

            - name: Build
              run: npm run build

            - name: Verify package
              run: npm pack --dry-run

            - name: Extract version from release
              if: github.event_name == 'release'
              id: version
              run: |
                  VERSION=${GITHUB_REF#refs/tags/v}
                  VERSION=${VERSION#refs/tags/}
                  echo "version=$VERSION" >> $GITHUB_OUTPUT
                  echo "Publishing version: $VERSION"

            - name: Verify version matches package.json
              if: github.event_name == 'release'
              run: |
                  PACKAGE_VERSION=$(node -p "require('./package.json').version")
                  RELEASE_VERSION="${{ steps.version.outputs.version }}"
                  if [ "$PACKAGE_VERSION" != "$RELEASE_VERSION" ]; then
                    echo "Error: package.json version ($PACKAGE_VERSION) doesn't match release tag ($RELEASE_VERSION)"
                    exit 1
                  fi
                  echo "Version verified: $PACKAGE_VERSION"

            - name: Update package.json version (manual)
              if: github.event_name == 'workflow_dispatch'
              run: |
                  npm version "${{ github.event.inputs.version }}" --no-git-tag-version
                  echo "Updated package.json to version ${{ github.event.inputs.version }}"

            # OIDC trusted publishing: no token. npm authenticates via the
            # workflow's id-token against the package's configured trusted publisher
            # on npmjs.com. Idempotent: skips if this version is already published.
            - name: Publish to npm
              run: |
                  VERSION=$(node -p "require('./package.json').version")
                  if npm view "@amadeus-protocol/sdk@$VERSION" version >/dev/null 2>&1; then
                    echo "v$VERSION already on npm — skipping publish"
                  else
                    npm publish --provenance --access public
                  fi
